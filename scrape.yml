name: Scrape 247 Basketball Transfer Portal

on:
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install playwright
          playwright install chromium
          playwright install-deps chromium

      - name: Run scraper
        run: python scrape_247_bball_portal.py 250

      - name: Upload CSV
        uses: actions/upload-artifact@v4
        with:
          name: transfer-portal-csv
          path: transfer_portal_top_250.csv
          retention-days: 30
